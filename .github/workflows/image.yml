name: image

# Builds the container image and, for a release, pushes it to
# ghcr.io/<owner>/lodestar under the version it was built from.
#
# A release is a tag `v<version>` pushed to the repository: the version
# must be the one in Cargo.toml, and the image is tagged with it (0.1.0
# for v0.1.0). There is no `latest` tag: compose.yaml names a version.
# The run then creates the release on GitHub, with that version's
# section of CHANGELOG.md as its notes. A release that already exists
# for the tag is left as it is.
#
# Run by hand, the workflow builds the image and pushes nothing unless
# `push` is ticked, so the build can be tried without a release.
#
# A package this workflow creates is private. It is made public once, by
# hand, in the package's settings; nothing here changes its visibility.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push:
        description: "Push the image (tagged with the version in Cargo.toml)"
        type: boolean
        default: false

# `contents: write` is for creating the release; nothing is pushed to
# the repository.
permissions:
  contents: write
  packages: write

# One build at a time for a given ref.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

# Every action is named by the commit it runs, with the tag that commit
# was read from in a comment: a tag can be moved, a commit cannot.

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # The crate's version: the first `version = "…"` under
          # [package].
          version="$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version *=/{gsub(/[" ]/,"",$0); sub(/^version=/,"",$0); print; exit}' Cargo.toml)"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::no version found in Cargo.toml"; exit 1 ;;
          esac
          # A release tag must name the version it is pushed on.
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::tag $REF_NAME was pushed on a tree whose version is $version"
            exit 1
          fi
          # And compose.yaml must name the image this run produces.
          if ! grep -q "ghcr.io/$OWNER/lodestar:$version\$" compose.yaml; then
            echo "::error::compose.yaml does not name ghcr.io/$OWNER/lodestar:$version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$OWNER/lodestar" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to the registry
        if: github.ref_type == 'tag' || inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.ref_type == 'tag' || inputs.push == true }}
          tags: ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=lodestar
            org.opencontainers.image.description=A compact, read-only mirror of the PLC directory
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "a release for $TAG exists; left as it is"
            exit 0
          fi
          # The version's section of the changelog: from its heading to
          # the next version heading or the link list at the end.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          gh release create "$TAG" --repo "$REPO" --verify-tag \
            --title "lodestar $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Summary
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PUSHED: ${{ github.ref_type == 'tag' || inputs.push == true }}
        run: |
          {
            echo "### Image"
            if [ "$PUSHED" = true ]; then
              echo "Pushed \`$IMAGE:$VERSION\`"
              echo
              echo "Digest: \`$DIGEST\`"
            else
              echo "Built \`$IMAGE:$VERSION\` and pushed nothing."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
