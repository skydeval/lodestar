name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every action is named by the commit it runs, with the tag that commit
# was read from in a comment: a tag can be moved, a commit cannot.
# `dtolnay/rust-toolchain` is pinned on its `stable` branch, whose action
# installs the stable toolchain; `toolchain: stable` says so here too.

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The tests that need Postgres run against this one; each makes a
    # schema of its own.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lodestar
          POSTGRES_PASSWORD: lodestar
          POSTGRES_DB: lodestar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lodestar -d lodestar_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      LODESTAR_TEST_DATABASE_URL: postgres://lodestar:lodestar@localhost:5432/lodestar_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # Advisories, licences, banned and duplicated crates, and where crates
  # come from, as deny.toml sets them.
  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
